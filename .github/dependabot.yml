version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # zstd-sys is pinned to =2.0.9 (libzstd 1.5.5): a newer libzstd can
    # change the compressed bytes, and output must match RomVault exactly.
    # libz-sys is pinned to =1.1.31 (zlib 1.3.2) for the same reason.
    ignore:
      - dependency-name: "zstd-sys"
      - dependency-name: "libz-sys"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
